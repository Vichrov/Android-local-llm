name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic repository check
        run: echo "Repository workflow is active"

  sync-v041-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'sync v0.4-1 release metadata')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update v0.4-1 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.4-1 --title 'Local Eyes v0.4-1' --notes-file RELEASE_NOTES.md
