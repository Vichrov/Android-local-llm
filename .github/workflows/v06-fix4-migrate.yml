name: v0.6-Fix4 source migration
on:
  push:
    branches: [main]
    paths: ['scripts/v06_fix4_patch.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/v06_fix4_patch.py
      - name: Commit source wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/vichrov/localai/MainActivity.java
          git commit -m 'feat(voice): native AEC3 and selectable Piper TTS'
          git push
