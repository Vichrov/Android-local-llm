name: v0.5 source migration
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v05_patch.py'
      - '.github/workflows/v05-migrate.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted v0.5 source patch
        run: python3 scripts/v05_patch.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/vichrov/localai/MainActivity.java
          git commit -m 'feat: wire v0.5 performance tuning into MainActivity'
          git push
