name: Android build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Fetch pinned inference engine
        run: bash scripts/fetch-llama.sh
      - run: python3 scripts/fetch-sherpa.py
      - name: Real Russian audio regression (host Vosk)
        run: python3 scripts/run_asr_smoke.py
      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package preview APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LocalEyes-v0.6-Fix-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/LocalEyes-v0.6-Fix-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/LocalEyes-v0.6-Fix-arm64.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LocalEyes-v0.6-Fix-arm64
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/asr-host-smoke.txt
            app/build/reports/tests
            app/build/reports/lint-results-debug.*
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - name: Free space for emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - run: bash scripts/fetch-llama.sh
      - run: python3 scripts/fetch-sherpa.py
      - name: Prepare verified GigaAM test models
        run: python3 scripts/giga_assets.py
      - name: Build actual app for emulator
        run: ./gradlew --no-daemon -PtestAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Cold launch, chat and live theme regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          disk-size: 2048M
          emulator-boot-timeout: 240
          script: |
            python3 scripts/startup_smoke.py
            python3 scripts/android_giga_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-android-${{ matrix.api }}
          path: app/build/reports/startup/
  release-v06-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, startup]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LocalEyes-v0.6-Fix-arm64
          path: dist
      - name: Publish v0.6-Fix prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6-Fix >/dev/null 2>&1; then
            echo 'v0.6-Fix already exists'
            exit 0
          fi
          gh release create v0.6-Fix dist/* --target "$GITHUB_SHA" --title 'Local Eyes v0.6-Fix' --notes-file RELEASE_NOTES_V06_FIX.md --prerelease
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, startup]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LocalEyes-v0.6-Fix-arm64
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Local Eyes $GITHUB_REF_NAME" --notes-file RELEASE_NOTES_V06_FIX.md --prerelease
