plugins { id 'com.android.application' }
android {
    namespace 'com.vichrov.localai'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'com.vichrov.localai'
        minSdk 31
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 14
        versionName '0.6-Fix4'
        ndk { abiFilters providers.gradleProperty('testAbi').getOrElse('arm64-v8a') }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++20' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging {
        jniLibs { useLegacyPackaging = false }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation files(rootProject.file('vendor/sherpa-onnx.aar'))
    implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize:v1.5.9'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
